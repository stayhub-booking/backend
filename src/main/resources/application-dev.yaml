spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stayhub}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

logging:
  level:
    com.ntd7505.stayhub: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.security: DEBUG

app:
  jwt:
    secret: dev-only-secret-key-at-least-32-characters-long
    cookie-secure: false