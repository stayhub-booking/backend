spring:
  application:
    name: stayhub
  profiles:
    active: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO

app:
  jwt:
    secret: ${JWT_SECRET}                  # không có default
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    issuer: stayhub-api
    cookie-name: jwt-token
    cookie-http-only: true
    cookie-secure: true                    # mặc định an toàn