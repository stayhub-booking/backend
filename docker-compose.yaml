services:
  db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: stayhub
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT:-5432}:5432"

    volumes:
      - stayhub-postgres-data:/var/lib/postgresql/data


volumes:
  stayhub-postgres-data: