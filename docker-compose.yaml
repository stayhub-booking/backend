services:
  db:
    image: postgres:17
    restart: "no"

    environment:
      POSTGRES_DB: stayhub
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT:-5432}:5432"

    volumes:
      - stayhub-postgres-data:/var/lib/postgresql/data


  mailpit:
    image: axllent/mailpit
    restart: "no"

    ports:
      - "1025:1025"
      - "8025:8025"


volumes:
  stayhub-postgres-data: